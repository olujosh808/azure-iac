name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        id: azure-login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        id: tf-setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Format
        id: tf-fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: tf-init
        run: terraform init

      - name: Terraform Validate
        id: tf-validate
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        run: terraform plan
